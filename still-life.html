<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Still Life | HENRY LUX PHOTOGRAPHY</title>

  <meta name="description" content="Still life by Henry Lux, based in New York City.">

  <link rel="canonical" href="https://henryluxphotography.com/still-life.html">
  <meta property="og:title" content="Still Life | Henry Lux Photography">
  <meta property="og:description" content="Still life by Henry Lux, based in New York City.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://henryluxphotography.com/still-life.html">
  <meta property="og:site_name" content="Henry Lux Photography">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="selected-portfolio still-life-portfolio">

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header prototype-header">
    <a href="index.html" class="logo" aria-label="Henry Lux, home">HENRY LUX</a>

    <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
      <a href="projects.html" class="current-page" aria-current="true">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <button
      type="button"
      class="menu-toggle"
      id="menu-toggle"
      aria-label="Toggle navigation"
      aria-controls="site-nav"
      aria-expanded="false"
    >
      Menu
    </button>
  </header>

  <main id="main-content">

    <section class="page-intro portfolio-intro" aria-labelledby="portfolio-title">
      <a class="back-link" href="projects.html"><span aria-hidden="true">&#8592;</span> Work</a>
      <p class="eyebrow">Portfolio</p>
      <h1 id="portfolio-title">Still Life</h1>
      <p>
        Still life shaped by light, form, and surface.
      </p>
    </section>

    <section class="gallery portfolio-grid" aria-label="Still Life photographs">
      <div class="portfolio-row" style="--row-ratio: 3.983333; --row-gaps: 2;">
        <a href="images/still-life/large/still-life-01-eggs-whisk.jpg" style="--image-ratio: 0.983333;">
          <img src="images/still-life/thumb/still-life-thumb-01-eggs-whisk.jpg"
            alt="Still life photograph of eggs against a light background" width="1180" height="1200" decoding="async">
        </a>
        <a href="images/still-life/large/still-life-02-breadfruit-knife.jpg" style="--image-ratio: 1.500000;">
          <img src="images/still-life/thumb/still-life-thumb-02-breadfruit-knife.jpg"
            alt="Still life photograph of breadfruit with a knife" width="1200" height="800" decoding="async">
        </a>
        <a href="images/still-life/large/still-life-03-eggs-measuring-cup-whisk.jpg" style="--image-ratio: 1.500000;">
          <img src="images/still-life/thumb/still-life-thumb-03-eggs-measuring-cup-whisk.jpg"
            alt="Still life photograph of eggs and a measuring cup" width="1200" height="800" decoding="async">
        </a>
      </div>

      <div class="portfolio-row" style="--row-ratio: 3.284167; --row-gaps: 2;">
        <a href="images/still-life/large/still-life-04-grater-whisks.jpg" style="--image-ratio: 0.984167;">
          <img src="images/still-life/thumb/still-life-thumb-04-grater-whisks.jpg"
            alt="Still life photograph of kitchen tools including a grater and whisks" width="1181" height="1200" loading="lazy" decoding="async">
        </a>
        <a href="images/still-life/large/still-life-05-orange-glass-shadow.jpg" style="--image-ratio: 0.800000;">
          <img src="images/still-life/thumb/still-life-thumb-05-orange-glass-shadow.jpg"
            alt="Still life photograph of orange glass with a cast shadow" width="960" height="1200" loading="lazy" decoding="async">
        </a>
        <a href="images/still-life/large/still-life-06-chocolate-orange-pan.jpg" style="--image-ratio: 1.500000;">
          <img src="images/still-life/thumb/still-life-thumb-06-chocolate-orange-pan.jpg"
            alt="Still life photograph of chocolate and orange in a pan" width="1200" height="800" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="portfolio-row" style="--row-ratio: 2.166667; --row-gaps: 1;">
        <a href="images/still-life/large/still-life-07-blue-bowl-fruit.jpg" style="--image-ratio: 0.666667;">
          <img src="images/still-life/thumb/still-life-thumb-07-blue-bowl-fruit.jpg"
            alt="Still life photograph of fruit in a blue bowl" width="800" height="1200" loading="lazy" decoding="async">
        </a>
        <a href="images/still-life/large/still-life-08-strawberries-kisses.jpg" style="--image-ratio: 1.500000;">
          <img src="images/still-life/thumb/still-life-thumb-08-strawberries-kisses.jpg"
            alt="Still life photograph of strawberries and wrapped chocolate" width="1200" height="800" loading="lazy" decoding="async">
        </a>
      </div>

    </section>

    <nav class="project-end" aria-label="Portfolio navigation">
      <a class="text-link" href="projects.html"><span aria-hidden="true">&#8592;</span> Back to Work</a>
    </nav>
  </main>

  <footer class="site-footer prototype-footer">
    <p>&copy; 2026 Henry Downes / Henry Lux. All images and content reserved. — 
      <a href="https://instagram.com/hluxphotography" target="_blank" rel="noopener noreferrer">Instagram</a>
    </p>
  </footer>

  <!-- Lightbox Modal Box -->

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Expanded photograph">

    <button type="button" class="lightbox-close" aria-label="Close image">&times;</button>

    <button type="button" class="lightbox-zoom" id="lightbox-zoom" aria-label="Expand image" aria-pressed="false">+</button>

    <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous image">&#10094;</button>

    <img class="lightbox-content" id="lightbox-img" alt="">

    <p class="lightbox-position" id="lightbox-position" aria-live="polite" aria-atomic="true"></p>

    <button type="button" class="lightbox-nav lightbox-next" aria-label="Next image">&#10095;</button>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
