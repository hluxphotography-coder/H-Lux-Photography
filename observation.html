<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observation | HENRY LUX PHOTOGRAPHY</title>
  <meta name="description" content="Observation, a project of 15 photographs by Henry Lux.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="observation-project">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header prototype-header">
    <a href="index.html" class="logo" aria-label="Henry Lux, home">HENRY LUX</a>

    <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
      <a href="projects.html" class="current-page" aria-current="true">Work</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <button
      type="button"
      class="menu-toggle"
      id="menu-toggle"
      aria-label="Toggle navigation"
      aria-controls="site-nav"
      aria-expanded="false"
    >
      Menu
    </button>
  </header>

  <main id="main-content">
    <section class="observation-intro" aria-labelledby="project-title">
      <a class="back-link" href="projects.html"><span aria-hidden="true">&#8592;</span> Work</a>
      <p class="eyebrow">Project</p>
      <h1 id="project-title">Observation</h1>
      <p class="observation-metadata">15 photographs</p>
    </section>

    <section class="gallery observation-sequence" aria-label="Observation photograph sequence">
      <div class="observation-group observation-wide">
        <a href="images/projects/observation/full/observation-01-yellow-helmets.jpg">
          <img src="images/projects/observation/thumb/observation-01-yellow-helmets-thumb.jpg"
            alt="Two people in yellow helmets and reflective vests riding a motorcycle past pedestrians" width="1200" height="800" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-pair">
        <a href="images/projects/observation/full/observation-02-bmx.jpg">
          <img src="images/projects/observation/thumb/observation-02-bmx-thumb.jpg"
            alt="BMX rider balancing on one wheel, framed by another rider and bicycle in the foreground" width="1200" height="801" loading="lazy" decoding="async">
        </a>
        <a href="images/projects/observation/full/observation-03-walkers-shadows.jpg">
          <img src="images/projects/observation/thumb/observation-03-walkers-shadows-thumb.jpg"
            alt="Two walkers casting long shadows across a sunlit city sidewalk, in black and white" width="1200" height="791" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-wide">
        <a href="images/projects/observation/full/observation-04-umbrellas.jpg">
          <img src="images/projects/observation/thumb/observation-04-umbrellas-thumb.jpg"
            alt="Pedestrians under umbrellas against bright red and white illuminated stripes" width="1200" height="800" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-portrait">
        <a href="images/projects/observation/full/observation-05-stairs.jpg">
          <img src="images/projects/observation/thumb/observation-05-stairs-thumb.jpg"
            alt="A figure descending stairs beside a curved ramp, divided by sunlight and deep shadow" width="801" height="1200" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-inset">
        <a href="images/projects/observation/full/observation-06-yellow-vehicle-driver.jpg">
          <img src="images/projects/observation/thumb/observation-06-yellow-vehicle-driver-thumb.jpg"
            alt="Driver seen through the open side of a yellow three-wheeled vehicle" width="1200" height="800" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-square">
        <a href="images/projects/observation/full/observation-07-turnstile.jpg">
          <img src="images/projects/observation/thumb/observation-07-turnstile-thumb.jpg"
            alt="A person with a backpack passing through a metal subway turnstile" width="1200" height="1200" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-pair">
        <a href="images/projects/observation/full/observation-08-spiral-staircase.jpg">
          <img src="images/projects/observation/thumb/observation-08-spiral-staircase-thumb.jpg"
            alt="A dark spiral staircase and bands of sunlight falling across the floor" width="1200" height="1200" loading="lazy" decoding="async">
        </a>
        <a href="images/projects/observation/full/observation-09-Woman-light-leak.jpg">
          <img src="images/projects/observation/thumb/observation-09-Woman-light-leak-thumb.jpg"
            alt="A woman beside a column and a bright beam of light in a room with wooden chairs" width="1200" height="1200" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-wide">
        <a href="images/projects/observation/full/observation-10-daytime-food-stand.jpg">
          <img src="images/projects/observation/thumb/observation-10-daytime-food-stand-thumb.jpg"
            alt="Customer facing a daytime food stand covered with colorful menus, with a vendor at the window" width="1200" height="800" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-inset observation-inset-right">
        <a href="images/projects/observation/full/observation-11-bench-pair.jpg">
          <img src="images/projects/observation/thumb/observation-11-bench-pair-thumb.jpg"
            alt="Two people sitting on a wooden bench, with two more people on the grass behind them" width="1200" height="800" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-pair">
        <a href="images/projects/observation/full/observation-12-awkward-man.jpg">
          <img src="images/projects/observation/thumb/observation-12-awkward-man-thumb.jpg"
            alt="A man leaning sideways on a dimly lit sidewalk, his movement blurred beside a pole" width="1200" height="800" loading="lazy" decoding="async">
        </a>
        <a href="images/projects/observation/full/observation-13-child-shutter-drag.jpg">
          <img src="images/projects/observation/thumb/observation-13-child-shutter-drag-thumb.jpg"
            alt="A child silhouetted against a car, with streaks of light and motion blur in black and white" width="1200" height="800" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-inset">
        <a href="images/projects/observation/full/observation-14-hot-spot.jpg">
          <img src="images/projects/observation/thumb/observation-14-hot-spot-thumb.jpg"
            alt="An illuminated Hot Spot food cart at night, with a vendor and two customers" width="1200" height="800" loading="lazy" decoding="async">
        </a>
      </div>

      <div class="observation-group observation-wide observation-finale">
        <a href="images/projects/observation/full/observation-15-subway-pair.jpg">
          <img src="images/projects/observation/thumb/observation-15-subway-pair-thumb.jpg"
            alt="Two people seated together on a subway bench, one resting their head on the other's shoulder" width="1200" height="900" loading="lazy" decoding="async">
        </a>
      </div>
    </section>

    <nav class="project-end" aria-label="Project navigation">
      <a class="text-link" href="projects.html"><span aria-hidden="true">&#8592;</span> Back to Work</a>
    </nav>
  </main>

  <footer class="site-footer prototype-footer">
    <p>
      &copy; 2026 Henry Downes / Henry Lux. All images and content reserved. —
      <a
        href="https://instagram.com/hluxphotography"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>
    </p>
  </footer>

  <!-- Lightbox Modal -->

  <div
    id="lightbox"
    class="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Expanded photograph"
  >
    <button
      type="button"
      class="lightbox-close"
      aria-label="Close image"
    >
      &times;
    </button>

    <button
      type="button"
      class="lightbox-zoom"
      id="lightbox-zoom"
      aria-label="Expand image"
      aria-pressed="false"
    >
      +
    </button>

    <button
      type="button"
      class="lightbox-nav lightbox-prev"
      aria-label="Previous image"
    >
      &#10094;
    </button>

    <img class="lightbox-content" id="lightbox-img" alt="">

    <p class="lightbox-position" id="lightbox-position" aria-live="polite" aria-atomic="true"></p>

    <button
      type="button"
      class="lightbox-nav lightbox-next"
      aria-label="Next image"
    >
      &#10095;
    </button>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
